name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build app bundle
        run: scripts/build-app.sh
      - name: Package app bundle
        run: ditto -c -k --sequesterRsrc --keepParent build/Logcatnip.app build/Logcatnip.zip
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Logcatnip-${{ github.sha }}
          path: build/Logcatnip.zip
          retention-days: 14
